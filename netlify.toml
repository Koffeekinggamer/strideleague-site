# Static site. No build step. Netlify publishes this directory as-is.
[build]
  publish = "."

# Rewrites, not redirects. The browser stays on the original URL.
# Status 200 serves 404.html at that URL. There is no 3xx.
[[redirects]]
  from = "/auth/callback"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/auth/callback/"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/join/*"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/i/*"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/j/*"
  to = "/404.html"
  status = 200

[[redirects]]
  from = "/race/*"
  to = "/404.html"
  status = 200

# Help page. The app links to /help/step-sources (no trailing slash).
# The page lives at help/step-sources/index.html. Static files win over
# this rule, so it only matters if Netlify does not resolve the folder.
[[redirects]]
  from = "/help/step-sources"
  to = "/help/step-sources/index.html"
  status = 200

# Association files. Served as JSON with no redirect. No redirect rule
# above matches /.well-known/*, so Netlify serves the static files as-is.
# _headers sets the same values; this keeps netlify.toml self-contained.
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
